{% extends "base.html" %}
{% block title %}Change Password{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
  <h5 class="mb-0 fw-bold">Change Password</h5>
  <a href="{{ url_for('auth.profile') }}" class="btn btn-sm btn-outline-secondary">&larr; Back to Profile</a>
</div>

<form method="post">
  <div class="card mb-3" style="max-width:480px;">
    <div class="card-body row g-3">
      <div class="col-12">
        <label class="form-label small">Current Password *</label>
        <input type="password" name="current_password" class="form-control form-control-sm" required>
      </div>
      <div class="col-12">
        <label class="form-label small">New Password *</label>
        <input type="password" name="new_password" class="form-control form-control-sm" minlength="8" required>
        <div class="form-text">At least 8 characters.</div>
      </div>
      <div class="col-12">
        <label class="form-label small">Confirm New Password *</label>
        <input type="password" name="confirm_password" class="form-control form-control-sm" minlength="8" required>
      </div>
    </div>
  </div>
  <button class="btn btn-accent">Change Password</button>
</form>
{% endblock %}
