{% extends "base.html" %}
{% block title %}My Profile{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
  <h5 class="mb-0 fw-bold">My Profile</h5>
</div>

<form method="post">
  <div class="card mb-3">
    <div class="card-body row g-3">
      <div class="col-md-6">
        <label class="form-label small">Full Name *</label>
        <input type="text" name="full_name" class="form-control form-control-sm" value="{{ current_user.full_name }}" required>
      </div>
      <div class="col-md-6">
        <label class="form-label small">Username</label>
        <input type="text" class="form-control form-control-sm" value="{{ current_user.username }}" disabled>
      </div>
      <div class="col-md-6">
        <label class="form-label small">Email</label>
        <input type="email" class="form-control form-control-sm" value="{{ current_user.email }}" disabled>
      </div>
      <div class="col-md-6">
        <label class="form-label small">Phone</label>
        <input type="text" name="phone" class="form-control form-control-sm" value="{{ current_user.phone or '' }}">
      </div>
      <div class="col-md-6">
        <label class="form-label small">Role</label>
        <input type="text" class="form-control form-control-sm" value="{{ current_user.role | replace('_',' ') | capitalize }}" disabled>
      </div>
      <div class="col-md-6">
        <label class="form-label small">Designation</label>
        <input type="text" name="designation" class="form-control form-control-sm" value="{{ current_user.designation or '' }}">
      </div>
    </div>
  </div>
  <button class="btn btn-accent">Save Changes</button>
  <a href="{{ url_for('auth.change_password') }}" class="btn btn-outline-secondary">Change Password</a>
</form>
{% endblock %}
